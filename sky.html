<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Sky Team</title>
    <link rel="apple-touch-icon" href="sky.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sky Team" />
    <meta name="theme-color" content="#0d2238" />
    <style>
      :root {
        --blue: #2f6fcf;
        --org: #e8892b;
        --ink: #eef4fb;
        --card: rgba(10, 28, 46, 0.82);
        --line: rgba(255, 255, 255, 0.25);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0d2238;
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Rounded", system-ui,
          sans-serif;
        touch-action: manipulation;
      }
      .bg {
        position: fixed;
        inset: 0;
        background:
          url("skyback.png") center/cover no-repeat,
          linear-gradient(#17406b, #0d2238);
      }
      .bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          rgba(5, 15, 30, 0.55),
          rgba(5, 15, 30, 0.35) 40%,
          rgba(5, 15, 30, 0.7)
        );
      }
      #app {
        position: relative;
        z-index: 1;
        max-width: 460px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top) + 10px) 12px
          calc(env(safe-area-inset-bottom) + 24px);
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }
      .top a,
      .top button {
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        text-decoration: none;
      }
      h1 {
        margin: 4px 0 12px;
        text-align: center;
        font-size: 2rem;
        font-weight: 900;
        letter-spacing: 1px;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.7);
      }
      h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      p {
        margin: 0 0 10px;
        line-height: 1.35;
      }
      .c {
        text-align: center;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px;
        margin-bottom: 10px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .btn {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        color: #06182b;
        background: linear-gradient(#ffe9a8, #f0b84a);
        border: 0;
        border-radius: 14px;
        box-shadow: 0 4px 0 #8a6414;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #8a6414;
      }
      .btn.sec,
      .mini {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: none;
        border: 1px solid var(--line);
      }
      .mini {
        font: inherit;
        font-weight: 800;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 1rem;
      }
      .lnk {
        display: block;
        margin: 14px auto 0;
        background: none;
        border: 0;
        color: var(--ink);
        opacity: 0.7;
        text-decoration: underline;
        font: inherit;
        font-size: 0.8rem;
      }
      .ap {
        position: relative;
        overflow: hidden;
        display: block;
        width: 100%;
        text-align: left;
        margin-bottom: 10px;
        padding: 18px 16px;
        min-height: 96px;
        font: inherit;
        color: var(--ink);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .ap:disabled {
        opacity: 1;
        color: var(--ink);
      }
      .ap b {
        display: block;
        font-size: 1.35rem;
        margin-bottom: 4px;
      }
      .ap small {
        display: block;
        opacity: 0.8;
      }
      .ban {
        position: absolute;
        right: -38px;
        top: 16px;
        width: 170px;
        text-align: center;
        transform: rotate(30deg);
        background: #d71920;
        color: #fff;
        font-style: normal;
        font-weight: 900;
        padding: 4px 0;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .info {
        display: flex;
        justify-content: space-between;
        font-weight: 800;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }
      .trk {
        display: flex;
        gap: 3px;
        margin-bottom: 8px;
      }
      .trk div {
        flex: 1;
        min-width: 0;
        text-align: center;
        padding: 4px 0;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 0.7rem;
        line-height: 1.25;
      }
      .trk .cur {
        background: #f0b84a;
        color: #06182b;
        font-weight: 800;
      }
      .trk b {
        display: block;
        font-size: 0.8rem;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        font-size: 0.82rem;
        margin-bottom: 8px;
      }
      .ax {
        display: flex;
        gap: 2px;
      }
      .ax i {
        width: 18px;
        height: 14px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.18);
      }
      .ax i.x {
        background: rgba(215, 25, 32, 0.55);
      }
      .ax i.on {
        background: #fff;
        outline: 2px solid #f0b84a;
      }
      #msg {
        text-align: center;
        font-weight: 800;
        margin: 6px 0 10px;
        min-height: 2.6em;
      }
      .cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .cols h3 {
        margin: 0 0 6px;
        font-size: 0.85rem;
        text-align: center;
      }
      .sp {
        display: flex;
        flex-direction: row;
        gap: 8px;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-bottom: 5px;
        min-height: 46px;
        font: inherit;
        font-size: 1.15rem;
        font-weight: 900;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        border: 2px dashed var(--line);
        border-radius: 10px;
      }
      .sp small {
        font-size: 1.15rem;
        font-weight: 900;
        opacity: 1;
      }
      .sp.P {
        border-color: var(--blue);
      }
      .sp.C {
        border-color: var(--org);
      }
      .sp.K {
        border-color: #bbb;
      }
      .sp.M,
      .sp.full.M {
        border-color: #ff4d4d;
      }
      .sp.M {
        border-style: dotted;
        border-width: 3px;
      }
      .sp.full.P {
        background: var(--blue);
        border-style: solid;
      }
      .sp.full.C {
        background: var(--org);
        border-style: solid;
      }
      .sp.full.K {
        background: #8a8f99;
        border-style: solid;
      }
      .sp.dep {
        box-shadow: inset 0 0 0 2px #4ade80;
      }
      .sp.ok {
        background: rgba(255, 255, 255, 0.28);
        animation: pl 1s infinite alternate;
      }
      @keyframes pl {
        to {
          transform: scale(1.04);
        }
      }
      .kr {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 6px;
      }
      .dice {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 8px 0;
      }
      .die {
        width: 58px;
        height: 58px;
        font: inherit;
        font-size: 1.8rem;
        font-weight: 900;
        color: #fff;
        border: 3px solid transparent;
        border-radius: 12px;
        background: var(--blue);
      }
      .die.C {
        background: var(--org);
      }
      .die.sel {
        border-color: #fff;
        transform: translateY(-6px);
      }
      .die.rs {
        border-color: #ff5c5c;
        transform: translateY(-6px);
      }
      .adj {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-weight: 800;
      }
      .res {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 900;
        margin-bottom: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .sp.ok {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div id="app">
      <div class="top">
        <a href="index.html">← Menu</a>
        <button id="vw" hidden>← Back</button>
        <button id="sw" hidden></button>
      </div>
      <div id="main"></div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      firebase.initializeApp({
        apiKey: "AIzaSyBr_drU2L3wndWce7i2Pjtpepuwc_VnAzY",
        authDomain: "wordle-d7fab.firebaseapp.com",
        databaseURL:
          "https://wordle-d7fab-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "wordle-d7fab",
        storageBucket: "wordle-d7fab.firebasestorage.app",
        messagingSenderId: "1048912631015",
        appId: "1:1048912631015:web:f389f317c49a4eeb89be42",
      });
      const root = firebase.database().ref("skyteam");
      const $ = (id) => document.getElementById(id);
      const PL = ["Graeme", "Stephen"];
      const oth = (n) => (n === "Graeme" ? "Stephen" : "Graeme");
      const ALT = [6000, 5000, 4000, 3000, 2000, 1000, 0];
      // base = planes per space (R1..RN, last space = airport); dice = spaces holding a traffic die
      const AIR = {
        montreal: {
          name: "Montréal-Trudeau",
          code: "YUL",
          base: [0, 0, 1, 2, 1, 3, 2],
          dice: [],
        },
        heathrow: {
          name: "London Heathrow",
          code: "LHR",
          base: [0, 1, 1, 2, 2, 2],
          dice: [1, 3, 5],
        },
        gardermoen: {
          name: "Oslo Gardermoen",
          code: "OSL",
          base: [0, 0, 1, 0, 1, 1, 1, 0],
          dice: [1, 1, 4],
        },
      };
      const SP = [
        { id: "Pa", r: "P", t: "axis", l: "Axis" },
        { id: "Pe", r: "P", t: "eng", l: "Engines" },
        { id: "Pr", r: "P", t: "radio", l: "Radio" },
        { id: "G0", r: "P", t: "gear", n: 0, ok: [1, 2], l: "Gear" },
        { id: "G1", r: "P", t: "gear", n: 1, ok: [3, 4], l: "Gear" },
        { id: "G2", r: "P", t: "gear", n: 2, ok: [5, 6], l: "Gear" },
        { id: "B0", r: "P", t: "brk", n: 0, ok: [2], l: "Brake" },
        { id: "B1", r: "P", t: "brk", n: 1, ok: [4], l: "Brake" },
        { id: "B2", r: "P", t: "brk", n: 2, ok: [6], l: "Brake" },
        { id: "Ca", r: "C", t: "axis", l: "Axis" },
        { id: "Ce", r: "C", t: "eng", l: "Engines" },
        { id: "Cr0", r: "C", t: "radio", l: "Radio" },
        { id: "Cr1", r: "C", t: "radio", l: "Radio" },
        { id: "F0", r: "C", t: "flap", n: 0, ok: [1, 2], l: "Flaps" },
        { id: "F1", r: "C", t: "flap", n: 1, ok: [2, 3], l: "Flaps" },
        { id: "F2", r: "C", t: "flap", n: 2, ok: [4, 5], l: "Flaps" },
        { id: "F3", r: "C", t: "flap", n: 3, ok: [5, 6], l: "Flaps" },
        { id: "K0", r: "K", t: "cof", l: "Coffee" },
        { id: "K1", r: "K", t: "cof", l: "Coffee" },
        { id: "K2", r: "K", t: "cof", l: "Coffee" },
      ];
      // view = which game I'm in: "pilot" (I fly) or "copilot" (other player is pilot)
      // Two games live in Firebase at skyteam/games/<pilotName>
      let me = localStorage.getItem("sky_me"),
        ap = null,
        view = null,
        D = {},
        sel = -1,
        adj = 0,
        rsel = [];
      const key = () => ap + "_" + (view === "pilot" ? me : oth(me));
      const G = () => root.child("games/" + key());
      const curGame = () =>
        (me && ap && view && D.games ? D.games[key()] : null) || null;
      const cnt = (a) => (a || []).reduce((x, y) => x + (y ? 1 : 0), 0);
      const blue = (g) => 4.5 + cnt(g.gear),
        orange = (g) => 8.5 + cnt(g.flap),
        brake = (g) => 2 + cnt(g.brk);
      const rd = (n) => 1 + Math.floor(Math.random() * n);
      const roleOf = (g) => (me === g.pilot ? "pilot" : "copilot");

      function allowed(g, role, s, v) {
        if (s.r !== "K" && s.r !== (role === "pilot" ? "P" : "C")) return false;
        if (g.placed && g.placed[s.id]) return false;
        const left = ((g.dice && g.dice[role]) || []).length,
          mine = SP.filter(
            (x) =>
              x.r === (role === "pilot" ? "P" : "C") &&
              (x.t === "axis" || x.t === "eng"),
          ),
          need = mine.filter((x) => !(g.placed && g.placed[x.id])).length;
        if (need && left <= need && !mine.some((x) => x.id === s.id))
          return false;
        if (s.ok && !s.ok.includes(v)) return false;
        if ((s.t === "flap" || s.t === "brk") && s.n > 0 && !g[s.t][s.n - 1])
          return false;
        return true;
      }
      function lose(g, why) {
        g.over = { w: 0, m: why };
        g.phase = "over";
      }
      function place(g, role, s, v) {
        g.placed = g.placed || {};
        g.placed[s.id] = { r: role, v: v };
        const N = g.planes.length,
          pl = g.placed;
        let m = g[role] + " placed " + v + " on " + s.l + ". ";
        if (s.t === "radio") {
          const i = g.pos + v - 1;
          if (i <= N && g.planes[i - 1] > 0) {
            g.planes[i - 1]--;
            m += "Plane cleared at R" + i + ".";
          }
        } else if (s.t === "axis" && pl.Pa && pl.Ca) {
          g.axis += pl.Pa.v - pl.Ca.v;
          m += "Axis is now " + g.axis + ".";
          if (Math.abs(g.axis) >= 3) lose(g, "The plane went into a spin!");
        } else if (s.t === "eng" && pl.Pe && pl.Ce) {
          g.speed = pl.Pe.v + pl.Ce.v;
          m += "Speed " + g.speed + ". ";
          if (!(g.alt === 6 && g.pos === N)) {
            const a = g.speed < blue(g) ? 0 : g.speed > orange(g) ? 2 : 1;
            if (a) {
              if (g.pos + a > N) lose(g, "You overshot the airport!");
              else if (g.planes[g.pos - 1] > 0)
                lose(g, "Collision with another plane!");
              else g.pos += a;
            }
            m += "Advance " + a + ".";
          }
        } else if (s.t === "gear" || s.t === "flap" || s.t === "brk")
          g[s.t][s.n] = 1;
        else if (s.t === "cof" && g.coffee < 3) g.coffee++;
        g.msg = m;
      }
      function finish(g) {
        if (g.over) return;
        if (Object.keys(g.placed).length < 8) {
          g.turn = g.turn === "pilot" ? "copilot" : "pilot";
          return;
        }
        const p = g.placed,
          N = g.planes.length;
        if (!(p.Pa && p.Ca && p.Pe && p.Ce))
          return lose(g, "Axis and Engines both need a die from each pilot!");
        if (g.alt === 6) {
          const bad = [];
          if (g.planes.some((x) => x > 0)) bad.push("planes left on the track");
          if (cnt(g.gear) < 3 || cnt(g.flap) < 4)
            bad.push("gear or flaps not all out");
          if (g.axis) bad.push("plane not level");
          if (g.speed >= brake(g)) bad.push("too fast for the brakes");
          if (bad.length)
            return lose(g, "Landing failed: " + bad.join(", ") + ".");
          g.over = {
            w: 1,
            m: "Smooth landing! The passengers burst into applause!",
          };
          g.phase = "over";
          root.child("wins/" + g.airport + "/" + g.pilot).set(true);
          return;
        }
        g.alt++;
        if (g.alt === 6 && g.pos < N)
          return lose(g, "Crash landed before reaching the airport!");
        if (g.alt === 4) g.rr++;
        g.round++;
        delete g.placed;
        delete g.dice;
        delete g.rolled;
        // New round starts straight away: whoever goes first can roll and play
        g.phase = "place";
        g.turn = g.round % 2 ? "pilot" : "copilot";
        g.msg =
          (g.alt === 6
            ? "Final approach! "
            : g.pos === N
              ? "Holding over the airport. Slow down. "
              : "Round " + g.round + ". ") +
          g[g.turn] +
          " goes first.";
      }

      function render() {
        const m = $("main");
        $("sw").hidden = !me;
        $("sw").textContent = "Playing as " + me + " ✎";
        $("vw").hidden = !(me && ap);
        if (!me) {
          m.innerHTML = `<h1>SKY TEAM</h1><div class="panel"><h2>Who's playing on this phone?</h2>${PL.map((n) => `<button class="btn" data-act="who" data-v="${n}">I'm ${n}</button>`).join("")}</div>`;
          return;
        }
        if (!ap) return lobby(m);
        if (!view) return chooser(m);
        const g = curGame();
        if (g) game(m, g);
        else m.innerHTML = `<h1>SKY TEAM</h1><p class="c">Starting game…</p>`;
      }
      // Step 1: airport list
      function lobby(m) {
        const gs = D.games || {};
        let h = `<h1>SKY TEAM</h1><p class="c">Choose an airport</p>`;
        for (const k in AIR) {
          const a = AIR[k],
            w = (D.wins || {})[k] || {},
            done = w.Graeme && w.Stephen,
            live = [me, oth(me)].filter(
              (p) => gs[k + "_" + p] && gs[k + "_" + p].phase !== "over",
            ).length;
          h += `<button class="ap" data-act="air" data-v="${k}">${done ? '<i class="ban">Completed</i>' : ""}<b>${a.name}</b><small>${a.code} · ${a.base.length} spaces${a.dice.length ? " · random traffic" : ""}</small><small>Won as Pilot: ${PL.filter((n) => w[n]).join(", ") || "none yet"}</small>${live ? `<small>⏳ ${live} game${live > 1 ? "s" : ""} in progress</small>` : ""}</button>`;
        }
        m.innerHTML =
          h +
          `<button class="lnk" data-act="resetdone">Reset completed airports</button>`;
      }
      // Step 2: Pilot / Co-Pilot prompt for the chosen airport
      function chooser(m) {
        const o = oth(me);
        const card = (r) => {
          const k = ap + "_" + (r === "pilot" ? me : o),
            g = (D.games || {})[k];
          const you = r === "pilot" ? "Pilot" : "Co-Pilot",
            mate = r === "pilot" ? "Co-Pilot" : "Pilot";
          let s;
          if (!g) s = "No game yet · tap to start one";
          else if (g.phase === "over")
            s = g.over.w ? "🏆 Landed" : "💥 Mission failed";
          else
            s =
              "Round " +
              Math.min(g.round, 7) +
              "/7" +
              (g.phase === "place" && g.turn === r ? " · ⏳ your turn" : "");
          return `<button class="ap" data-act="view" data-v="${r}"><b>${r === "pilot" ? "✈ " : "🧑‍✈️ "}Play as ${you}</b><small>${s}</small><small>${o} is the ${mate}</small></button>`;
        };
        m.innerHTML = `<h1>SKY TEAM</h1><p class="c">${AIR[ap].name}</p><p class="c">Which game do you want to play?</p>${card("pilot")}${card("copilot")}`;
      }
      function cell(g, s, v, ok) {
        const pl = g.placed && g.placed[s.id],
          dep = s.n !== undefined && g[s.t][s.n];
        return `<button class="sp ${s.r} ${s.t === "axis" || s.t === "eng" ? "M" : ""} ${pl ? "full" : ""} ${ok && !pl && v && allowed(g, ok, s, v) ? "ok" : ""} ${dep ? "dep" : ""}" data-act="sp" data-v="${s.id}"><small>${s.l}${dep ? " ✓" : ""}</small>${pl ? pl.v : s.ok ? s.ok.join("/") : ""}</button>`;
      }
      function game(m, g) {
        const role = roleOf(g),
          or = role === "pilot" ? "copilot" : "pilot",
          N = g.planes.length,
          A = AIR[g.airport];
        const dice = (g.dice && g.dice[role]) || [],
          od = (g.dice && g.dice[or]) || [];
        const rolled = g.rolled || {},
          rolledMe = !!rolled[role];
        const pend = g.rrPend && g.rrPend[role];
        if (!pend) rsel = [];
        const myTurn =
          g.phase === "place" && g.turn === role && !g.rrPend && rolledMe;
        const v = myTurn && sel >= 0 && dice[sel] ? dice[sel] + adj : 0;
        let h = `<div class="info"><span>${A.name}</span><span>Round ${Math.min(g.round, 7)}/7 · ${g.alt === 6 ? "Landing" : ALT[g.alt] + " ft"}</span></div>`;
        h += `<div class="trk">${g.planes.map((n, i) => `<div class="${i + 1 === g.pos ? "cur" : ""}"><b>${i + 1 === N ? "🛬" : "R" + (i + 1)}</b>${n ? "✈".repeat(n) : "·"}</div>`).join("")}</div>`;
        let ax = "";
        for (let k = -3; k <= 3; k++)
          ax += `<i class="${Math.abs(k) === 3 ? "x" : ""} ${k === g.axis ? "on" : ""}"></i>`;
        h += `<div class="stats"><span>Speed 0 under ${blue(g)}, 2 over ${orange(g)}</span><span>Brake ${brake(g)}</span><span>☕ ${g.coffee}/3</span><span>🔄 ${g.rr}</span><span class="ax">${ax}</span></div>`;
        h += `<div id="msg">${g.msg || ""}</div>`;
        if (g.phase === "over") {
          h += `<div class="panel"><div class="res">${g.over.w ? "🏆 You landed!" : "💥 Mission failed"}</div><p class="c">${g.over.m}</p><button class="btn" data-act="newgame">Choose a new airport</button></div>`;
        } else {
          h += `<div class="cols"><div><h3>${g.pilot} · Pilot</h3>${SP.filter(
            (s) => s.r === "P",
          )
            .map((s) => cell(g, s, v, myTurn && role))
            .join("")}</div><div><h3>${g.copilot} · Co-Pilot</h3>${SP.filter(
            (s) => s.r === "C",
          )
            .map((s) => cell(g, s, v, myTurn && role))
            .join("")}</div></div>`;
          h += `<div class="kr">${SP.filter((s) => s.r === "K")
            .map((s) => cell(g, s, v, myTurn && role))
            .join("")}</div>`;
          let status;
          if (pend) status = "Reroll: tap the dice to reroll";
          else if (g.rrPend) status = "Waiting for " + g[or] + " to reroll…";
          else if (!rolledMe)
            status =
              g.turn === role
                ? "You go first this round. Roll when you're ready."
                : "You can roll your dice any time.";
          else if (myTurn) status = "Your turn: tap a die, then a space";
          else
            status = rolled[or]
              ? "Waiting for " + g[or] + " (" + od.length + " dice left)"
              : "Waiting for " + g[or] + " to roll…";
          h += `<div class="panel" style="margin-top:10px"><p class="c">${status}</p>`;
          if (!rolledMe) {
            h += `<button class="btn" data-act="roll">Roll my dice</button>`;
          } else {
            h += `<div class="dice">${dice.map((d, i) => `<button class="die ${role === "copilot" ? "C" : ""} ${i === sel && !pend ? "sel" : ""} ${rsel.includes(i) ? "rs" : ""}" data-act="die" data-v="${i}">${d}</button>`).join("")}</div>`;
            if (pend)
              h += `<div class="adj"><button class="mini" data-act="rrgo">Reroll selected</button><button class="mini" data-act="rrkeep">Keep all</button></div>`;
            else if (myTurn && sel >= 0 && dice[sel])
              h += `<div class="adj"><button class="mini" data-act="adj" data-v="-1">−</button><span>Value ${v}${adj ? " (" + Math.abs(adj) + " ☕)" : ""}</span><button class="mini" data-act="adj" data-v="1">+</button></div>`;
            if (g.rr > 0 && !g.rrPend)
              h += `<button class="btn sec" data-act="rr">Use a Reroll token (${g.rr})</button>`;
          }
          h += `</div>`;
        }
        m.innerHTML = h;
      }
      function newGame() {
        const A = AIR[ap],
          pilot = view === "pilot" ? me : oth(me),
          pl = A.base.slice(),
          N = pl.length,
          rolls = [];
        A.dice.forEach((k) => {
          const i = Math.min(k + 1 + rd(4), N);
          pl[i - 1]++;
          rolls.push("R" + k + "→R" + i);
        });
        const ng = {
          airport: ap,
          pilot: pilot,
          copilot: oth(pilot),
          round: 1,
          pos: 1,
          alt: 0,
          planes: pl,
          gear: [0, 0, 0],
          flap: [0, 0, 0, 0],
          brk: [0, 0, 0],
          axis: 0,
          coffee: 0,
          rr: 1,
          phase: "place",
          turn: "pilot",
          speed: 0,

            (rolls.length ? " Traffic dice: " + rolls.join(", ") + "." : ""),
        };
        // only create if this game doesn't already exist
        G().transaction((cur) => (cur ? undefined : ng));
      }
      function act(a, v) {
        const g = curGame(),
          role = g && roleOf(g);
        if (a === "who") {
          me = v;
          ap = null;
          view = null;
          localStorage.setItem("sky_me", v);
        } else if (a === "sw") {
          localStorage.removeItem("sky_me");
          me = null;
          ap = null;
          view = null;
        } else if (a === "air") {
          ap = v;
          view = null;
        } else if (a === "view") {
          view = v;
          sel = -1;
          adj = 0;
          rsel = [];
          if (!curGame()) newGame();
        } else if (a === "back") {
          if (view) view = null;
          else ap = null;
          sel = -1;
          adj = 0;
          rsel = [];
        } else if (a === "roll") {
          if (!g || (g.rolled && g.rolled[role])) return;
          G().update({
            ["dice/" + role]: [rd(6), rd(6), rd(6), rd(6)],
            ["rolled/" + role]: true,
          });
          return;
        } else if (a === "die") {
          const i = +v;
          if (g.rrPend && g.rrPend[role])
            rsel = rsel.includes(i)
              ? rsel.filter((x) => x !== i)
              : rsel.concat(i);
          else if (g.phase === "place" && g.turn === role && !g.rrPend) {
            sel = sel === i ? -1 : i;
            adj = 0;
          }
        } else if (a === "adj") {
          const d = (g.dice[role] || [])[sel],
            n = adj + +v;
          if (d && d + n >= 1 && d + n <= 6 && Math.abs(n) <= g.coffee) adj = n;
        } else if (a === "sp") {
          if (
            !(
              g &&
              g.phase === "place" &&
              g.turn === role &&
              !g.rrPend &&
              sel >= 0
            )
          )
            return;
          const d = ((g.dice && g.dice[role]) || [])[sel],
            s = SP.find((x) => x.id === v);
          if (!d || !allowed(g, role, s, d + adj)) return;
          const n = JSON.parse(JSON.stringify(g)),
            val = d + adj;
          n.dice[role].splice(sel, 1);
          n.coffee -= Math.abs(adj);
          place(n, role, s, val);
          finish(n);
          sel = -1;
          adj = 0;
          G().set(n);
          return;
        } else if (a === "rr") {
          if (g.rr > 0 && !g.rrPend && g.phase === "place") {
            // only players who have rolled dice still behind their screen reroll
            const rp = {};
            ["pilot", "copilot"].forEach((r) => {
              if (
                g.rolled &&
                g.rolled[r] &&
                g.dice &&
                g.dice[r] &&
                g.dice[r].length
              )
                rp[r] = 1;
            });
            if (!rp[role]) return;
            G().update({ rr: g.rr - 1, rrPend: rp });
          }
          return;
        } else if (a === "rrgo") {
          const d = ((g.dice && g.dice[role]) || []).slice();
          rsel.forEach((i) => (d[i] = rd(6)));
          G()
            .child("dice/" + role)
            .set(d);
          G()
            .child("rrPend/" + role)
            .remove();
          rsel = [];
          return;
        } else if (a === "rrkeep") {
          G()
            .child("rrPend/" + role)
            .remove();
          return;
        } else if (a === "newgame") {
          G().remove();
          ap = null;
          view = null;
          sel = -1;
          adj = 0;
          return;
        } else if (a === "resetdone") {
          if (confirm("Clear all Completed banners?"))
            root.child("wins").remove();
          return;
        }
        render();
      }
      $("app").addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (b && !b.disabled) act(b.dataset.act, b.dataset.v);
      });
      $("sw").dataset.act = "sw";
      $("vw").dataset.act = "back";
      root.on("value", (s) => {
        D = s.val() || {};
        const g = curGame();
        if (g && sel >= 0 && !((g.dice && g.dice[roleOf(g)]) || [])[sel]) {
          sel = -1;
          adj = 0;
        }
        render();
      });
      render();
    </script>
  </body>
</html>
